<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Банкомат-Калькулятор - Васильев Н.Д.</title>
  <link rel="stylesheet" href="atm-style.css">
  <script src="script.js" defer></script>
</head>
<body id="atm_environment">

  <div class="atm_header_info">
    <details class="atm_author_details">
      <summary>Информация о разработчике</summary>
      <p>Автор: Васильев Николай Денисович</p>
      <p>Группа: ИУ5-42Б</p>
    </details>

    <div class="atm_lab_goal">
      <p>Цель ЛР: <mark>знакомство</mark> с <mark>HTML</mark>, <mark>CSS</mark> и <mark>JavaScript</mark> на примере калькулятора-банкомата.</p>
    </div>

    <select class="atm_currency_dropdown" id="currency_selector">
      <option value="rub">Операции в: Рублях (₽)</option>
      <option value="usd">Операции в: Долларах ($)</option>
      <option value="eur">Операции в: Евро (€)</option>
    </select>

<div class="atm_top_controls">
      <button id="trigger_theme" class="atm_system_btn">Сменить тему</button>

      <button id="trigger_screen_color" class="atm_system_btn">Цвет экрана</button>

      <a href="https://github.com/Kolyan777-K/PSP-ATM-System.git" target="_blank" class="atm_system_btn atm_link_btn">Мой GitHub</a>
    </div>

  <div class="atm_main_terminal">
    <div id="atm_monitor" class="atm_monitor_screen">
      <span id="result">0</span> <span id="currency_symbol">₽</span>
    </div>

    <div class="atm_control_panel">

      <div class="atm_key_row">
        <button id="calc_m_plus" class="atm_key atm_mem_key">M+</button>
        <button id="calc_m_minus" class="atm_key atm_mem_key">M-</button>
        <button id="calc_sq" class="atm_key atm_adv_key">x²</button>
        <button id="calc_sqrt" class="atm_key atm_adv_key">√</button>
        <button id="calc_fact" class="atm_key atm_adv_key">x!</button>
      </div>

      <div class="atm_key_row">
        <button id="calc_clear" class="atm_key atm_secondary_key">C</button>
        <button id="calc_backspace" class="atm_key atm_secondary_key">⌫</button>
        <button id="calc_sign" class="atm_key atm_secondary_key">+/-</button>
        <button id="calc_percent" class="atm_key atm_secondary_key">%</button>
        <button id="calc_div" class="atm_key atm_primary_key">/</button>
      </div>

      <div class="atm_key_row">
        <button id="btn_digit_7" class="atm_key atm_num_key">7</button>
        <button id="btn_digit_8" class="atm_key atm_num_key">8</button>
        <button id="btn_digit_9" class="atm_key atm_num_key">9</button>
        <button id="calc_commission" class="atm_key atm_com_key">-3%</button>
        <button id="calc_mult" class="atm_key atm_primary_key">x</button>
      </div>

      <div class="atm_key_row">
        <button id="btn_digit_4" class="atm_key atm_num_key">4</button>
        <button id="btn_digit_5" class="atm_key atm_num_key">5</button>
        <button id="btn_digit_6" class="atm_key atm_num_key">6</button>
        <button id="calc_minus" class="atm_key atm_primary_key">-</button>
      </div>

      <div class="atm_key_row">
        <button id="btn_digit_1" class="atm_key atm_num_key">1</button>
        <button id="btn_digit_2" class="atm_key atm_num_key">2</button>
        <button id="btn_digit_3" class="atm_key atm_num_key">3</button>
        <button id="calc_plus" class="atm_key atm_primary_key">+</button>
      </div>

      <div class="atm_key_row">
        <button id="btn_digit_0" class="atm_key atm_num_key">0</button>
        <button id="btn_digit_000" class="atm_key atm_num_key">000</button>
        <button id="btn_digit_dot" class="atm_key atm_num_key">.</button>
        <button id="calc_equal" class="atm_key atm_execute_key">=</button>
      </div>
    </div>
  </div>

  <footer class="atm_footer_signature">
    ЛР выполнил Васильев Николай Денисович ИУ5-42Б
  </footer>

</body>
</html>
